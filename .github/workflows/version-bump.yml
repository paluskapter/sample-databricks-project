name: Version bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Version bump
        run: |
          NEW_VERSION=$(sed -n '/^version = /p' pyproject.toml | cut -d'"' -f 2 | awk -F. '{$2++;print}' OFS=.)
          sed -i "s/^version = \"[^\"]*\"/version = \"${NEW_VERSION}\"/g" pyproject.toml
          sed -i '/^name = "aviation-trend-analyzer"$/ {n; s/^version = "[^"]*"/version = "'"${NEW_VERSION}"'"/;}' uv.lock
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit
        uses: EndBug/add-and-commit@v10.0.0
        with:
          author_name: GitHub bot
          author_email: bot@github.com
          message: 'Version bump to ${{ env.NEW_VERSION }}'
          tag: ${{ env.NEW_VERSION }}
